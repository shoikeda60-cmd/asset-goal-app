<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>小学2年生 漢字テスト</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#fff8e8,#eef8ff);color:#222;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:24px;box-shadow:0 12px 30px #0001;padding:18px;margin-bottom:16px}h1{font-size:clamp(24px,6vw,36px);margin:0}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.pill,.badge{border-radius:999px;padding:7px 11px;font-weight:800}.pill{background:#f3f4f6}.badge{background:#e8f4ff;color:#1769aa;font-size:12px}.q{margin:16px 0 8px;padding:15px;background:#fff7cc;border-radius:18px;font-size:clamp(22px,5vw,32px);font-weight:800}.hint,.small{color:#6b7280;font-size:13px}.cw{display:flex;justify-content:center;margin:15px 0}canvas{width:min(82vw,420px);aspect-ratio:1;background:#fff;border:4px solid #333;border-radius:16px;touch-action:none}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:800}#clear{background:#e5e7eb}#judge{background:#219ebc;color:#fff}#next{grid-column:1/-1;background:#ffb703}.result{text-align:center;min-height:56px;font-size:25px;font-weight:900;margin-top:12px}.ok{color:#2a9d8f}.ng{color:#e63946}.ans{text-align:center;font-size:48px;font-weight:900}.finish{display:none;text-align:center}.finish.show{display:block}.score{font-size:56px;font-weight:1000;color:#15616d}.restart{width:100%;background:#219ebc;color:#fff;margin-top:14px}</style></head><body><div class="wrap"><div class="card" id="quiz"><div class="top"><h1>小学2年生 漢字テスト</h1><div class="pill"><span id="n">1</span>/10もん</div></div><div class="q" id="q"></div><div class="hint">したの ますに タッチペンで かいてね。</div><div class="badge">自動判定モード</div><div class="cw"><canvas id="c" width="600" height="600"></canvas></div><div class="buttons"><button id="clear">けす</button><button id="judge">じどうで はんてい</button><button id="next">つぎのもんだい</button></div><div id="result" class="result"></div><div id="ans" class="ans"></div><div id="detail" class="small" style="text-align:center"></div></div><div class="card finish" id="finish"><h2>おしまい！</h2><div id="score" class="score"></div><div id="msg"></div><button class="restart" onclick="location.reload()">もういちど</button></div><div class="card small">書いた字の形を見本と比べて自動判定します。子どもの字でも通りやすいよう、少しゆるめの判定です。</div></div><script>const pool=[['はる','春'],['なつ','夏'],['あき','秋'],['ふゆ','冬'],['そら','空'],['うみ','海'],['やま','山'],['かわ','川'],['くも','雲'],['ゆき','雪'],['かぜ','風'],['ひかり','光'],['ほし','星'],['あさ','朝'],['ひる','昼'],['よる','夜'],['みち','道'],['くに','国'],['とも','友'],['おや','親'],['ちち','父'],['はは','母'],['あに','兄'],['あね','姉'],['おとうと','弟'],['いもうと','妹'],['みせ','店'],['かう','買'],['うる','売']];const qs=[...pool].sort(()=>Math.random()-.5).slice(0,10);let i=0,score=0,judged=false,drawing=false,last=null,distance=0;const c=document.getElementById('c'),x=c.getContext('2d'),q=document.getElementById('q'),n=document.getElementById('n'),res=document.getElementById('result'),ans=document.getElementById('ans'),detail=document.getElementById('detail');function guide(){x.fillStyle='#fff';x.fillRect(0,0,600,600);x.save();x.strokeStyle='#d1d5db';x.lineWidth=2;x.setLineDash([12,12]);x.beginPath();x.moveTo(300,0);x.lineTo(300,600);x.moveTo(0,300);x.lineTo(600,300);x.stroke();x.restore()}function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*600/r.height}}c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);last=p(e)};c.onpointermove=e=>{if(!drawing)return;let a=p(e);x.strokeStyle='#111';x.lineCap='round';x.lineJoin='round';x.lineWidth=14+(e.pressure||.5)*14;x.beginPath();x.moveTo(last.x,last.y);x.lineTo(a.x,a.y);x.stroke();distance+=Math.hypot(a.x-last.x,a.y-last.y);last=a};c.onpointerup=c.onpointercancel=()=>{drawing=false;last=null};function clearAll(){guide();judged=false;distance=0;res.textContent='';res.className='result';ans.textContent='';detail.textContent=''}document.getElementById('clear').onclick=clearAll;function load(){clearAll();n.textContent=i+1;q.textContent=`『${qs[i][0]}』を かんじで かきましょう。`}function norm(canvas){const S=64,t=document.createElement('canvas');t.width=t.height=S;let g=t.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,S,S);g.drawImage(canvas,0,0,S,S);let d=g.getImageData(0,0,S,S).data,pts=[];for(let y=0;y<S;y++)for(let z=0;z<S;z++){let k=(y*S+z)*4,v=255-(d[k]+d[k+1]+d[k+2])/3;if(v>50)pts.push([z,y])}if(!pts.length)return Array(S*S).fill(0);let minX=99,minY=99,maxX=0,maxY=0;pts.forEach(([a,b])=>{minX=Math.min(minX,a);minY=Math.min(minY,b);maxX=Math.max(maxX,a);maxY=Math.max(maxY,b)});let w=maxX-minX+1,h=maxY-minY+1,s=Math.min(54/w,54/h),ox=(S-w*s)/2,oy=(S-h*s)/2,out=Array(S*S).fill(0);pts.forEach(([a,b])=>{let A=Math.round((a-minX)*s+ox),B=Math.round((b-minY)*s+oy);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){let xx=A+dx,yy=B+dy;if(xx>=0&&xx<S&&yy>=0&&yy<S)out[yy*S+xx]=1}});return out}function tpl(ch,font,weight){const S=64,t=document.createElement('canvas');t.width=t.height=S;let g=t.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,S,S);g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';g.font=`${weight} 52px ${font}`;g.fillText(ch,32,34);return norm(t)}function sim(a,b){let inter=0,uni=0,ca=0,cb=0;for(let j=0;j<a.length;j++){if(a[j]||b[j])uni++;if(a[j]&&b[j])inter++;if(a[j])ca++;if(b[j])cb++}let shape=uni?inter/uni:0,dens=ca&&cb?Math.min(ca,cb)/Math.max(ca,cb):0;return shape*.82+dens*.18}function judge(ch){if(distance<120)return{ok:false,s:0,msg:'まだ あまり かけていないかも'};let u=norm(c),best=0;for(let f of ['sans-serif','serif','"Yu Gothic",sans-serif'])for(let w of ['500','700'])best=Math.max(best,sim(u,tpl(ch,f,w)));let th=['山','川','父','母'].includes(ch)?.28:['雲','親','買','売','道'].includes(ch)?.31:.34;return{ok:best>=th,s:best}}document.getElementById('judge').onclick=()=>{if(judged)return;judged=true;let ch=qs[i][1],r=judge(ch);ans.textContent=ch;if(r.ok){res.textContent='○ せいかい！';res.className='result ok';score++}else{res.textContent='× ちがうかも';res.className='result ng'}detail.textContent=r.msg||`にてるど：${Math.round(r.s*100)}%`};document.getElementById('next').onclick=()=>{i++;if(i>=qs.length){document.getElementById('quiz').style.display='none';let f=document.getElementById('finish');f.classList.add('show');document.getElementById('score').textContent=`${score}/10`;document.getElementById('msg').textContent=score===10?'ぜんもんせいかい！すごい！':score>=8?'とっても よくできました！':score>=5?'いいちょうし！もういちど やってみよう！':'れんしゅうすると もっと じょうずになるよ！'}else load()};load();</script></body></html>
