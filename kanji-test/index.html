<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>小学2年生 漢字テスト</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#fff8e8,#eef8ff);color:#222;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:24px;box-shadow:0 12px 30px #0001;padding:18px;margin-bottom:16px}h1{font-size:clamp(24px,6vw,36px);margin:0}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.pill,.badge{border-radius:999px;padding:7px 11px;font-weight:800}.pill{background:#f3f4f6}.badge{background:#e8f4ff;color:#1769aa;font-size:12px}.q{margin:16px 0 8px;padding:15px;background:#fff7cc;border-radius:18px;font-size:clamp(22px,5vw,32px);font-weight:800}.hint,.small{color:#6b7280;font-size:13px}.cw{display:flex;justify-content:center;margin:15px 0}canvas{width:min(82vw,420px);aspect-ratio:1;background:#fff;border:4px solid #333;border-radius:16px;touch-action:none}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:16px;padding:15px;font-size:18px;font-weight:800}#clear{background:#e5e7eb}#judge{background:#219ebc;color:#fff}#next{grid-column:1/-1;background:#ffb703}.result{text-align:center;min-height:56px;font-size:25px;font-weight:900;margin-top:12px}.ok{color:#2a9d8f}.ng{color:#e63946}.ans{text-align:center;font-size:48px;font-weight:900}.finish{display:none;text-align:center}.finish.show{display:block}.score{font-size:56px;font-weight:1000;color:#15616d}.restart{width:100%;background:#219ebc;color:#fff;margin-top:14px}.checks{margin-top:10px;text-align:left;font-size:14px;line-height:1.65}.checks b{font-size:15px}.good{color:#18794e}.bad{color:#c1121f}.loading{color:#1769aa}.footer{font-size:11px;color:#888;line-height:1.5}</style></head><body><div class="wrap"><div class="card" id="quiz"><div class="top"><h1>小学2年生 漢字テスト</h1><div class="pill"><span id="n">1</span>/10もん</div></div><div class="q" id="q"></div><div class="hint">したの ますに タッチペンで、1かくずつ かいてね。</div><div class="badge">高精度：書き順・画数・とめ/はね/はらい判定</div><div class="cw"><canvas id="c" width="600" height="600"></canvas></div><div class="buttons"><button id="clear">けす</button><button id="judge">じどうで はんてい</button><button id="next">つぎのもんだい</button></div><div id="result" class="result"></div><div id="ans" class="ans"></div><div id="detail" class="small" style="text-align:center"></div><div id="checks" class="checks"></div></div><div class="card finish" id="finish"><h2>おしまい！</h2><div id="score" class="score"></div><div id="msg"></div><button class="restart" onclick="location.reload()">もういちど</button></div><div class="card footer">筆順・画形の基準データ: KanjiVG (CC BY-SA 3.0)。端末やタッチペンの取り方によって判定には多少の誤差があります。</div></div><script>
const pool=[['はる','春'],['なつ','夏'],['あき','秋'],['ふゆ','冬'],['そら','空'],['うみ','海'],['やま','山'],['かわ','川'],['くも','雲'],['ゆき','雪'],['かぜ','風'],['ひかり','光'],['ほし','星'],['あさ','朝'],['ひる','昼'],['よる','夜'],['みち','道'],['くに','国'],['とも','友'],['おや','親'],['ちち','父'],['はは','母'],['あに','兄'],['あね','姉'],['おとうと','弟'],['いもうと','妹'],['みせ','店'],['かう','買'],['うる','売']];
const qs=[...pool].sort(()=>Math.random()-.5).slice(0,10);let i=0,score=0,judged=false,drawing=false,current=null,strokes=[];const c=document.getElementById('c'),x=c.getContext('2d'),q=document.getElementById('q'),n=document.getElementById('n'),res=document.getElementById('result'),ans=document.getElementById('ans'),detail=document.getElementById('detail'),checks=document.getElementById('checks');
function guide(){x.fillStyle='#fff';x.fillRect(0,0,600,600);x.save();x.strokeStyle='#d1d5db';x.lineWidth=2;x.setLineDash([12,12]);x.beginPath();x.moveTo(300,0);x.lineTo(300,600);x.moveTo(0,300);x.lineTo(600,300);x.stroke();x.restore()}
function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*600/r.height,t:performance.now(),pressure:e.pressure||.5}}
c.onpointerdown=e=>{if(judged)return;drawing=true;c.setPointerCapture(e.pointerId);current=[p(e)]};c.onpointermove=e=>{if(!drawing||judged)return;let a=p(e),last=current[current.length-1];x.strokeStyle='#111';x.lineCap='round';x.lineJoin='round';x.lineWidth=14+a.pressure*14;x.beginPath();x.moveTo(last.x,last.y);x.lineTo(a.x,a.y);x.stroke();current.push(a)};function endStroke(e){if(!drawing)return;drawing=false;if(current&&current.length>1){if(e&&e.clientX!=null)current.push(p(e));strokes.push(current)}current=null}c.onpointerup=endStroke;c.onpointercancel=endStroke;
function clearAll(){guide();judged=false;strokes=[];current=null;res.textContent='';res.className='result';ans.textContent='';detail.textContent='';checks.innerHTML=''}document.getElementById('clear').onclick=clearAll;function load(){clearAll();n.textContent=i+1;q.textContent=`『${qs[i][0]}』を かんじで かきましょう。`;preload(qs[i][1])}load();
const refCache=new Map();function hex5(ch){return ch.codePointAt(0).toString(16).padStart(5,'0')}
async function preload(ch){if(refCache.has(ch))return refCache.get(ch);try{const url=`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${hex5(ch)}.svg`;const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('ref');const txt=await r.text();const doc=new DOMParser().parseFromString(txt,'image/svg+xml');const paths=[...doc.querySelectorAll('path[id*="-s"]')];const refs=paths.map(el=>sampleSvgPath(el.getAttribute('d')));refCache.set(ch,refs);return refs}catch(e){refCache.set(ch,null);return null}}
function sampleSvgPath(d){const svgNS='http://www.w3.org/2000/svg',svg=document.createElementNS(svgNS,'svg'),path=document.createElementNS(svgNS,'path');path.setAttribute('d',d);svg.appendChild(path);svg.style.position='absolute';svg.style.left='-9999px';document.body.appendChild(svg);const L=path.getTotalLength(),pts=[];for(let k=0;k<40;k++){let a=path.getPointAtLength(L*k/39);pts.push({x:a.x,y:a.y})}svg.remove();return pts}
function resample(poly,N=40){if(poly.length<2)return poly;let lens=[0];for(let j=1;j<poly.length;j++)lens.push(lens[j-1]+Math.hypot(poly[j].x-poly[j-1].x,poly[j].y-poly[j-1].y));let total=lens[lens.length-1];if(total<1)return poly;let out=[];for(let k=0;k<N;k++){let target=total*k/(N-1),j=1;while(j<lens.length&&lens[j]<target)j++;if(j>=lens.length){out.push({...poly[poly.length-1]});continue}let a=poly[j-1],b=poly[j],span=lens[j]-lens[j-1]||1,t=(target-lens[j-1])/span;out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}return out}
function bbox(all){let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;all.flat().forEach(p=>{minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)});return{minX,minY,maxX,maxY,w:Math.max(1,maxX-minX),h:Math.max(1,maxY-minY)}}
function normalizeUser(ss){if(!ss.length)return[];let b=bbox(ss),scale=Math.min(89/b.w,89/b.h),ox=(109-b.w*scale)/2,oy=(109-b.h*scale)/2;return ss.map(s=>resample(s).map(p=>({x:(p.x-b.minX)*scale+ox,y:(p.y-b.minY)*scale+oy,t:p.t}))) }
function meanDist(a,b,start=0,end=40){let sum=0,n=0;for(let k=start;k<Math.min(end,a.length,b.length);k++){sum+=Math.hypot(a[k].x-b[k].x,a[k].y-b[k].y);n++}return n?sum/n:99}
function angle(a,b){return Math.atan2(b.y-a.y,b.x-a.x)}function adiff(a,b){let d=Math.abs(a-b)%(Math.PI*2);return d>Math.PI?Math.PI*2-d:d}
function strokeMetrics(u,r){let whole=meanDist(u,r),tail=meanDist(u,r,30,40);let ua=angle(u[33],u[39]),ra=angle(r[33],r[39]),endAngle=adiff(ua,ra);let uturn=adiff(angle(u[28],u[34]),angle(u[34],u[39]));let rturn=adiff(angle(r[28],r[34]),angle(r[34],r[39]));let turnDiff=Math.abs(uturn-rturn);return{whole,tail,endAngle,turnDiff}}
function glyphImageScore(ch){const S=64,t=document.createElement('canvas');t.width=t.height=S;let g=t.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,S,S);g.drawImage(c,0,0,S,S);let user=g.getImageData(0,0,S,S).data;g.fillStyle='#fff';g.fillRect(0,0,S,S);g.fillStyle='#000';g.textAlign='center';g.textBaseline='middle';g.font='700 52px "Yu Gothic",sans-serif';g.fillText(ch,32,34);let ref=g.getImageData(0,0,S,S).data,inter=0,uni=0;for(let k=0;k<S*S;k++){let ui=255-(user[k*4]+user[k*4+1]+user[k*4+2])/3>55,ri=255-(ref[k*4]+ref[k*4+1]+ref[k*4+2])/3>55;if(ui||ri)uni++;if(ui&&ri)inter++}return uni?inter/uni:0}
async function judge(ch){let refs=await preload(ch);let shape=glyphImageScore(ch);if(!refs)return{ok:shape>.28,shape,fallback:true};if(strokes.length!==refs.length)return{ok:false,shape,reason:`画数がちがいます（書いたのは ${strokes.length}画、正しくは ${refs.length}画）`,count:false};let us=normalizeUser(strokes),bad=[],sum=0;for(let j=0;j<refs.length;j++){let m=strokeMetrics(us[j],refs[j]);sum+=m.whole;let strictEnd=(m.tail>13.5||m.endAngle>.70||m.turnDiff>.75);let badStroke=(m.whole>17.5||strictEnd);if(badStroke)bad.push({n:j+1,...m,strictEnd})}
let avg=sum/refs.length;let ok=bad.length===0&&avg<13.8&&shape>.20;return{ok,shape,avg,bad,count:true}}
document.getElementById('judge').onclick=async()=>{if(judged)return;if(strokes.length===0){res.textContent='× まだ かいていないよ';res.className='result ng';return}judged=true;res.textContent='はんてい中…';res.className='result loading';let ch=qs[i][1],r=await judge(ch);ans.textContent=ch;if(r.ok){res.textContent='○ せいかい！';res.className='result ok';score++;checks.innerHTML='<span class="good">✓ 形・画数・書き順・各画の終わり方 OK</span>'}else{res.textContent='× ちがいます';res.className='result ng';let html='';if(r.reason)html+=`<div class="bad">✗ ${r.reason}</div>`;if(r.bad&&r.bad.length){for(const b of r.bad){let why=b.strictEnd?'とめ・はね・はらい、または画の終わり方':'画の形や書き順';html+=`<div class="bad">✗ ${b.n}画目：${why}を見直してね</div>`}}if(!html)html='<div class="bad">✗ 字の形をもう一度たしかめてね</div>';checks.innerHTML=html}detail.textContent=r.fallback?'通信できなかったため簡易判定を使用しました':`形の一致度：${Math.round((r.shape||0)*100)}%`};
document.getElementById('next').onclick=()=>{i++;if(i>=qs.length){document.getElementById('quiz').style.display='none';let f=document.getElementById('finish');f.classList.add('show');document.getElementById('score').textContent=`${score}/10`;document.getElementById('msg').textContent=score===10?'ぜんもんせいかい！すごい！':score>=8?'とっても よくできました！':score>=5?'いいちょうし！もういちど やってみよう！':'れんしゅうすると もっと じょうずになるよ！'}else load()};
</script></body></html>
