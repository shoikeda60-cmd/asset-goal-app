<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>小学2年生 漢字テスト</title>
<style>
  :root{
    --bg:#fff8e8;
    --card:#ffffff;
    --ink:#222;
    --accent:#ffb703;
    --accent2:#219ebc;
    --ok:#2a9d8f;
    --ng:#e63946;
    --muted:#6b7280;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#fff8e8,#eef8ff);color:var(--ink);min-height:100vh}
  .wrap{width:min(760px,100%);margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:18px}
  h1{font-size:clamp(24px,6vw,36px);margin:0 0 8px}
  .topline{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
  .pill{background:#f3f4f6;border-radius:999px;padding:8px 12px;font-weight:700}
  .question{margin:18px 0 10px;padding:16px;background:#fff7cc;border-radius:18px;font-size:clamp(22px,5vw,32px);font-weight:800;line-height:1.5}
  .hint{color:var(--muted);font-size:14px;margin-top:4px}
  .canvas-wrap{display:flex;justify-content:center;margin:16px 0}
  canvas{width:min(82vw,420px);aspect-ratio:1/1;background:#fff;border:4px solid #333;border-radius:16px;touch-action:none;box-shadow:inset 0 0 0 1px #ddd}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  button{border:0;border-radius:16px;padding:15px 14px;font-size:18px;font-weight:800;cursor:pointer}
  #clearBtn{background:#e5e7eb;color:#111} #answerBtn{background:var(--accent2);color:white} #correctBtn{background:var(--ok);color:white} #wrongBtn{background:var(--ng);color:white} #nextBtn{background:var(--accent);color:#332500;grid-column:1/-1}
  .manual{display:none;margin-top:12px}.manual.show{display:block}.result{min-height:56px;margin-top:14px;font-size:22px;font-weight:900;text-align:center}.answer-box{margin-top:8px;text-align:center;font-size:44px;font-weight:900}.small{color:var(--muted);font-size:13px;text-align:center;margin-top:6px}.finish{display:none;text-align:center;padding:18px 8px}.finish.show{display:block}.finish h2{font-size:32px;margin:6px 0}.score{font-size:56px;font-weight:1000;color:#15616d}.restart{margin-top:16px;background:var(--accent2);color:white;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="quizCard">
    <div class="topline"><h1>小学2年生 漢字テスト</h1><div class="pill"><span id="count">1</span>/10もん</div></div>
    <div class="question" id="question"></div>
    <div class="hint">したの ますに タッチペンで かいてね。</div>
    <div class="canvas-wrap"><canvas id="draw" width="600" height="600" aria-label="漢字を書く場所"></canvas></div>
    <div class="buttons"><button id="clearBtn">けす</button><button id="answerBtn">こたえあわせ</button></div>
    <div class="result" id="result"></div><div class="answer-box" id="answerBox"></div>
    <div class="manual" id="manual"><div class="small">この試作版では、さいごの○×だけ人がえらびます。</div><div class="buttons"><button id="correctBtn">○ あってる</button><button id="wrongBtn">× ちがう</button><button id="nextBtn">つぎのもんだい</button></div></div>
  </div>
  <div class="card finish" id="finish"><h2>おしまい！</h2><div class="score" id="score">0/10</div><div id="message"></div><button class="restart" onclick="location.reload()">もういちど</button></div>
</div>
<script>
const pool=[
{q:"『はる』を かんじで かきましょう。",a:"春"},{q:"『なつ』を かんじで かきましょう。",a:"夏"},{q:"『あき』を かんじで かきましょう。",a:"秋"},{q:"『ふゆ』を かんじで かきましょう。",a:"冬"},{q:"『そら』を かんじで かきましょう。",a:"空"},{q:"『うみ』を かんじで かきましょう。",a:"海"},{q:"『やま』を かんじで かきましょう。",a:"山"},{q:"『かわ』を かんじで かきましょう。",a:"川"},{q:"『くも』を かんじで かきましょう。",a:"雲"},{q:"『ゆき』を かんじで かきましょう。",a:"雪"},{q:"『かぜ』を かんじで かきましょう。",a:"風"},{q:"『ひかり』を かんじで かきましょう。",a:"光"},{q:"『ほし』を かんじで かきましょう。",a:"星"},{q:"『あさ』を かんじで かきましょう。",a:"朝"},{q:"『ひる』を かんじで かきましょう。",a:"昼"},{q:"『よる』を かんじで かきましょう。",a:"夜"},{q:"『みち』を かんじで かきましょう。",a:"道"},{q:"『くに』を かんじで かきましょう。",a:"国"},{q:"『とも』を かんじで かきましょう。",a:"友"},{q:"『おや』を かんじで かきましょう。",a:"親"},{q:"『ちち』を かんじで かきましょう。",a:"父"},{q:"『はは』を かんじで かきましょう。",a:"母"},{q:"『あに』を かんじで かきましょう。",a:"兄"},{q:"『あね』を かんじで かきましょう。",a:"姉"},{q:"『おとうと』を かんじで かきましょう。",a:"弟"},{q:"『いもうと』を かんじで かきましょう。",a:"妹"},{q:"『てん』を かんじで かきましょう。",a:"店"},{q:"『みせ』を かんじで かきましょう。",a:"店"},{q:"『かう』の『か』を かんじで かきましょう。",a:"買"},{q:"『うる』の『う』を かんじで かきましょう。",a:"売"}
];
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
const questions=shuffle(pool).slice(0,10);let index=0,score=0,judged=false;
const qEl=document.getElementById('question'),countEl=document.getElementById('count'),resultEl=document.getElementById('result'),answerBox=document.getElementById('answerBox'),manual=document.getElementById('manual'),canvas=document.getElementById('draw'),ctx=canvas.getContext('2d');
function setupCanvas(){ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle="#111";ctx.lineWidth=18;ctx.lineCap="round";ctx.lineJoin="round";ctx.save();ctx.strokeStyle="#d1d5db";ctx.lineWidth=2;ctx.setLineDash([12,12]);ctx.beginPath();ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);ctx.moveTo(0,canvas.height/2);ctx.lineTo(canvas.width,canvas.height/2);ctx.stroke();ctx.restore()}
setupCanvas();let drawing=false,last=null;
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height)}}
canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);last=pos(e)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);const pressure=e.pressure&&e.pressure>0?e.pressure:.5;ctx.lineWidth=12+pressure*16;ctx.strokeStyle="#111";ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});canvas.addEventListener('pointerup',()=>{drawing=false;last=null});canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});
function clearCanvas(){setupCanvas();resultEl.textContent="";answerBox.textContent="";manual.classList.remove('show');judged=false}
document.getElementById('clearBtn').onclick=clearCanvas;
function load(){clearCanvas();countEl.textContent=index+1;qEl.textContent=questions[index].q}load();
document.getElementById('answerBtn').onclick=()=>{if(judged)return;judged=true;resultEl.textContent="せいかいは…";answerBox.textContent=questions[index].a;manual.classList.add('show')};
document.getElementById('correctBtn').onclick=()=>{resultEl.textContent="○ せいかい！";score++;document.getElementById('correctBtn').disabled=true;document.getElementById('wrongBtn').disabled=true};
document.getElementById('wrongBtn').onclick=()=>{resultEl.textContent="× つぎは がんばろう！";document.getElementById('correctBtn').disabled=true;document.getElementById('wrongBtn').disabled=true};
document.getElementById('nextBtn').onclick=()=>{document.getElementById('correctBtn').disabled=false;document.getElementById('wrongBtn').disabled=false;index++;if(index>=questions.length){finish()}else{load()}};
function finish(){document.getElementById('quizCard').style.display='none';const fin=document.getElementById('finish');fin.classList.add('show');document.getElementById('score').textContent=`${score}/10`;let msg="よく がんばりました！";if(score===10)msg="ぜんもんせいかい！すごい！";else if(score>=8)msg="とっても よくできました！";else if(score>=5)msg="いいちょうし！もういちど やってみよう！";document.getElementById('message').textContent=msg}
</script>
</body>
</html>
