name: FX 2025 Out-of-Time Experiment

on:
  push:
    branches: [ 'experiment/target-pips-3-4-519' ]
    paths:
      - '.github/workflows/backtest-fx-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-2025:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download USDJPY 1-minute history
        run: npx --yes dukascopy-node -i usdjpy -from 2025-06-01 -to 2025-09-01 -t m1 -f csv
      - name: Download Treasury histories
        run: |
          curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2025-05-01&coed=2025-09-01' -o DGS10.csv
          curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2&cosd=2025-05-01&coed=2025-09-01' -o DGS2.csv
      - name: Install dependencies
        run: python3 -m pip install --quiet numpy scikit-learn
      - name: Evaluate exact promoted model on Jul-Aug 2025
        run: |
          python3 - <<'PY'
          import json, math, sys
          from bisect import bisect_right
          from datetime import datetime, timezone, timedelta
          sys.path.insert(0, 'tools')
          import backtest_fx_ml as bt
          import backtest_fx_precision as px

          # Reconstruct Jul-Aug 2025 inputs using only information available then.
          bt.START = datetime(2025,7,1,tzinfo=timezone.utc)
          bt.TUNE = datetime(2025,9,1,tzinfo=timezone.utc)
          bt.HOLD = datetime(2025,9,1,tzinfo=timezone.utc)
          bt.CPI_EVENTS = [
              datetime(2025,7,15,12,30,tzinfo=timezone.utc),
              datetime(2025,8,12,12,30,tzinfo=timezone.utc),
          ]
          bt.NFP_EVENTS = [
              datetime(2025,7,3,12,30,tzinfo=timezone.utc),
              datetime(2025,8,1,12,30,tzinfo=timezone.utc),
          ]
          bt.FOMC_EVENTS = [datetime(2025,7,30,18,0,tzinfo=timezone.utc)]
          bt.MAJOR_EVENTS = sorted(bt.CPI_EVENTS + bt.NFP_EVENTS + bt.FOMC_EVENTS)

          with open('fx-model.json', encoding='utf-8') as f:
              model = json.load(f)

          m1, rows = bt.build()
          d10 = px.load_yield('DGS10.csv')
          d2 = px.load_yield('DGS2.csv')
          for r in rows:
              # Jul-Aug 2025: Fed target midpoint 4.375%, BOJ policy rate 0.5%.
              # Replace the hard-coded 2026 policy-difference feature with the historical value.
              r['x'][29] = (4.375 - 0.5) / 3.0
              r['xp'] = r['x'] + px.macro_extra(r['t'], d2, d10)

          def logistic(m, x):
              z = m['intercept']
              for i, v in enumerate(x):
                  z += ((v-m['mean'][i])/(m['scale'][i] or 1.0))*m['coef'][i]
              z = max(-40, min(40, z))
              return 1/(1+math.exp(-z))

          def hgb(m, x):
              raw = m['baseline']
              for nodes in m['trees']:
                  i = 0
                  while not nodes[i]['leaf']:
                      n = nodes[i]; v = x[n['f']]
                      if not math.isfinite(v):
                          i = n['l'] if n['ml'] else n['r']
                      else:
                          i = n['l'] if v <= n['t'] else n['r']
                  raw += nodes[i]['v']
              raw = max(-40, min(40, raw))
              return 1/(1+math.exp(-raw))

          times = [b['t'] for b in m1]
          periods = [
              ('2025-07-01..2025-07-31', datetime(2025,7,1,tzinfo=timezone.utc), datetime(2025,8,1,tzinfo=timezone.utc)),
              ('2025-08-01..2025-08-31', datetime(2025,8,1,tzinfo=timezone.utc), datetime(2025,9,1,tzinfo=timezone.utc)),
              ('2025-07-01..2025-08-31 ALL', datetime(2025,7,1,tzinfo=timezone.utc), datetime(2025,9,1,tzinfo=timezone.utc)),
          ]

          def evaluate(subrows, pips):
              rp = [logistic(model['reach'], r['xp']) for r in subrows]
              dp = [hgb(model['direction'], r['xp']) for r in subrows]
              selected = [i for i in range(len(subrows)) if rp[i] >= model['thresholds']['reach'] and max(dp[i],1-dp[i]) >= model['thresholds']['direction']]
              d = pips*.01
              hit = strict = ties = long_n = short_n = 0
              for i in selected:
                  r = subrows[i]
                  side = 'long' if dp[i] >= .5 else 'short'
                  long_n += side == 'long'; short_n += side == 'short'
                  j = bisect_right(times, r['t']); e = bisect_right(times, r['t']+timedelta(minutes=30))
                  fut = m1[j:e]; base = m1[j-1]['c']
                  lh = any(x['h'] >= base+d for x in fut); sh = any(x['l'] <= base-d for x in fut)
                  hit += lh if side == 'long' else sh
                  first = 'none'
                  for x in fut:
                      u = x['h'] >= base+d; dn = x['l'] <= base-d
                      if u and dn: first='tie'; ties += 1; break
                      if u: first='long'; break
                      if dn: first='short'; break
                  strict += first == side
              n = len(selected)
              return {
                  'signals': n,
                  'coverage_pct': 100*n/len(subrows) if subrows else 0,
                  'target_hit_30m_pct': 100*hit/n if n else 0,
                  'strict_first_touch_success_pct': 100*strict/n if n else 0,
                  'ties': ties,
                  'long': long_n,
                  'short': short_n,
              }

          out=[]
          for label,start,end in periods:
              sub=[r for r in rows if start <= r['t'] < end]
              out.append({'period':label,'rows':len(sub),'pips_3':evaluate(sub,3.0),'pips_5_191159':evaluate(sub,model['target_pips_reference'])})
          print('OUT_OF_TIME_2025_JSON')
          print(json.dumps(out,indent=2))
          PY
