name: FX 3pip Live Reach Model Experiment

on:
  push:
    branches: [ 'experiment/target-pips-3-4-519' ]
    paths:
      - '.github/workflows/backtest-fx-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-3pip-reach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download USDJPY history
        run: npx --yes dukascopy-node -i usdjpy -from 2026-01-01 -to 2026-08-15 -t m1 -f csv
      - name: Download Treasury histories
        run: |
          curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2026-01-01&coed=2026-08-15' -o DGS10.csv
          curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2&cosd=2026-01-01&coed=2026-08-15' -o DGS2.csv
      - name: Install dependencies
        run: python3 -m pip install --quiet numpy scikit-learn
      - name: Train and export 3pip reach model
        run: |
          python3 - <<'PY'
          import json, sys
          import numpy as np
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import brier_score_loss, roc_auc_score
          sys.path.insert(0, 'tools')
          import backtest_fx_ml as bt
          import backtest_fx_precision as px

          bt.TARGET = 3.0
          _, rows = bt.build()
          d2 = px.load_yield('DGS2.csv')
          d10 = px.load_yield('DGS10.csv')
          for r in rows:
              r['xp'] = r['x'] + px.macro_extra(r['t'], d2, d10)

          tr = [r for r in rows if r['t'] < bt.TUNE]
          ho = [r for r in rows if r['t'] >= bt.HOLD]
          X = np.array([r['xp'] for r in tr])
          y = np.array([1 if r['reach'] else 0 for r in tr])
          pipe = make_pipeline(StandardScaler(), LogisticRegression(C=.35, max_iter=2500, class_weight='balanced')).fit(X, y)

          sc = pipe.named_steps['standardscaler']
          lr = pipe.named_steps['logisticregression']
          Xh = np.array([r['xp'] for r in ho])
          yh = np.array([1 if r['reach'] else 0 for r in ho])
          ph = pipe.predict_proba(Xh)[:,1]

          out = {
              'target_pips': 3.0,
              'horizon_minutes': 30,
              'feature_count': int(X.shape[1]),
              'reach': {
                  'mean': [float(v) for v in sc.mean_],
                  'scale': [float(v) for v in sc.scale_],
                  'coef': [float(v) for v in lr.coef_[0]],
                  'intercept': float(lr.intercept_[0])
              },
              'validation': {
                  'period': '2026-07-01..2026-08-14',
                  'samples': int(len(ho)),
                  'observed_reach_either_direction_pct': float(100*yh.mean()),
                  'avg_predicted_probability_pct': float(100*ph.mean()),
                  'brier_score': float(brier_score_loss(yh, ph)),
                  'roc_auc': float(roc_auc_score(yh, ph))
              },
              'note': 'Dedicated live 3pip reach model. Reach means either +3pip or -3pip within 30 minutes; direction is handled separately by the promoted direction model.'
          }
          with open('fx-model-3pip.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print(json.dumps(out['validation'],indent=2))
          PY
      - name: Save experiment model to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx-model-3pip.json
          if ! git diff --cached --quiet; then
            git commit -m "Build dedicated 3pip live reach model"
            git pull --rebase origin experiment/target-pips-3-4-519
            git push origin HEAD:experiment/target-pips-3-4-519
          fi
