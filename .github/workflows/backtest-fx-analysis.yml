name: FX 3pip Same-47-Feature Reach Model

on:
  push:
    branches: [ 'experiment/target-pips-3-4-519' ]
    paths:
      - '.github/workflows/backtest-fx-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-3pip-same47:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download USDJPY history
        run: npx --yes dukascopy-node -i usdjpy -from 2026-01-01 -to 2026-08-15 -t m1 -f csv
      - name: Download Treasury histories
        run: |
          curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2026-01-01&coed=2026-08-15' -o DGS10.csv
          curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS2&cosd=2026-01-01&coed=2026-08-15' -o DGS2.csv
      - name: Install dependencies
        run: python3 -m pip install --quiet numpy scikit-learn
      - name: Train 3pip reach using exact production 47-feature inputs
        run: |
          python3 - <<'PY'
          import json, sys
          from bisect import bisect_right
          from datetime import timedelta
          import numpy as np
          from sklearn.pipeline import make_pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.linear_model import LogisticRegression
          from sklearn.metrics import brier_score_loss, roc_auc_score
          sys.path.insert(0, 'tools')
          import backtest_fx_ml as bt
          import backtest_fx_precision as px

          # IMPORTANT: do NOT change bt.TARGET. bt.build() therefore creates the
          # exact same 42 base features as production (5.1911590909pip scaling).
          # We only replace the reach LABEL with a 3.0pip/30-minute label.
          m1, rows = bt.build()
          d2 = px.load_yield('DGS2.csv')
          d10 = px.load_yield('DGS10.csv')
          for r in rows:
              r['xp'] = r['x'] + px.macro_extra(r['t'], d2, d10)

          times = [b['t'] for b in m1]
          def label3(r):
              j = bisect_right(times, r['t'])
              e = bisect_right(times, r['t'] + timedelta(minutes=30))
              fut = m1[j:e]
              if not fut or j == 0:
                  return None
              base = m1[j-1]['c']
              d = 0.03
              return int(any(x['h'] >= base+d or x['l'] <= base-d for x in fut))

          data=[]
          for r in rows:
              y=label3(r)
              if y is not None:
                  data.append((r['t'], r['xp'], y))

          tr=[x for x in data if x[0] < bt.TUNE]
          tu=[x for x in data if bt.TUNE <= x[0] < bt.HOLD]
          ho=[x for x in data if x[0] >= bt.HOLD]
          def xy(a):
              return np.array([x[1] for x in a]), np.array([x[2] for x in a])
          Xtr,ytr=xy(tr); Xtu,ytu=xy(tu); Xho,yho=xy(ho)

          # Same reach-model family and hyperparameters as the promoted 5.19pip model.
          pipe=make_pipeline(
              StandardScaler(),
              LogisticRegression(C=.35,max_iter=2500,class_weight='balanced')
          ).fit(Xtr,ytr)

          ptu=pipe.predict_proba(Xtu)[:,1]
          pho=pipe.predict_proba(Xho)[:,1]
          sc=pipe.named_steps['standardscaler']
          lr=pipe.named_steps['logisticregression']

          out={
              'target_pips':3.0,
              'horizon_minutes':30,
              'feature_count':int(Xtr.shape[1]),
              'feature_basis_target_pips':bt.TARGET,
              'reach':{
                  'mean':[float(v) for v in sc.mean_],
                  'scale':[float(v) for v in sc.scale_],
                  'coef':[float(v) for v in lr.coef_[0]],
                  'intercept':float(lr.intercept_[0])
              },
              'validation':{
                  'tune_period':'2026-06-01..2026-06-30',
                  'tune_samples':int(len(ytu)),
                  'tune_observed_reach_pct':float(100*ytu.mean()),
                  'tune_avg_probability_pct':float(100*ptu.mean()),
                  'tune_brier':float(brier_score_loss(ytu,ptu)),
                  'tune_auc':float(roc_auc_score(ytu,ptu)),
                  'holdout_period':'2026-07-01..2026-08-14',
                  'holdout_samples':int(len(yho)),
                  'holdout_observed_reach_pct':float(100*yho.mean()),
                  'holdout_avg_probability_pct':float(100*pho.mean()),
                  'holdout_brier':float(brier_score_loss(yho,pho)),
                  'holdout_auc':float(roc_auc_score(yho,pho))
              },
              'note':'3pip reach model trained on the exact same 47-feature vector and same LogisticRegression settings as the production 5.19pip reach model. Only the reach label is changed to ±3pip within 30 minutes. The production direction model is unchanged.'
          }
          with open('fx-model-3pip-same47.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          print(json.dumps(out['validation'],indent=2))
          PY
      - name: Save model to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx-model-3pip-same47.json
          if ! git diff --cached --quiet; then
            git commit -m "Build 3pip reach model on production 47 features"
            git pull --rebase origin experiment/target-pips-3-4-519
            git push origin HEAD:experiment/target-pips-3-4-519
          fi
