name: Fix FX decision time

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-fx-decision-time.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch FX 15-minute decision boundary and status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('fx-analysis.js')
          s=p.read_text(encoding='utf-8')

          old="const decisionCutoff=m1=>(m1.filter(b=>Math.floor(b.t/60000)%15===0).at(-1)||m1.at(-1)).t;"
          new="const decisionCutoff=m1=>{const last=m1.at(-1);if(!last)return 0;return Math.floor(last.t/(15*60*1000))*(15*60*1000);};"
          if old not in s:
              raise SystemExit('decisionCutoff pattern not found')
          s=s.replace(old,new,1)

          old="return{pips:Math.max(.1,targetPips()),reach,pLong,pShort:1-pLong,dirConf,signal,reasons,scores:f.scores,labels,price:f.price,cutoff};}"
          new="return{pips:Math.max(.1,targetPips()),reach,pLong,pShort:1-pLong,dirConf,signal,reasons,scores:f.scores,labels,price:f.price,cutoff,dataAt:series.m1.at(-1)?.t||cutoff};}"
          if old not in s:
              raise SystemExit('analyze return pattern not found')
          s=s.replace(old,new,1)

          old="$('fxaStatus').textContent='判定 '+new Date(a.cutoff).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' / 15分更新';}"
          new="$('fxaStatus').textContent='AI判定 '+new Date(a.cutoff).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'})+' / 価格 '+new Date(a.dataAt||a.cutoff).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}); }"
          if old not in s:
              raise SystemExit('render status pattern not found')
          s=s.replace(old,new,1)

          old="if(e)e.textContent='判定 '+new Date(cutoff).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' / 次回15分更新';"
          new="if(e){const dataAt=series.m1.at(-1)?.t||cutoff;e.textContent='AI判定 '+new Date(cutoff).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'})+' / 価格 '+new Date(dataAt).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});}"
          if old not in s:
              raise SystemExit('tick status pattern not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace("const CACHE='asset-goal-v29-realtime-primary';","const CACHE='asset-goal-v30-decision-time-fix';")
          w=w.replace('?v=29','?v=30')
          # Be tolerant if the exact v29 cache label differs, but always bump any current v29 label.
          if "asset-goal-v29" in w:
              import re
              w=re.sub(r"const CACHE='asset-goal-v29[^']*';","const CACHE='asset-goal-v30-decision-time-fix';",w,count=1)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx-analysis.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix FX 15-minute decision timestamp"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
