name: Fix FX decision time

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-fx-decision-time.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch FX 15-minute decision boundary and status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('fx-analysis.js')
          s=p.read_text(encoding='utf-8')

          s,n=re.subn(
              r"const decisionCutoff=m1=>[^\n]+;",
              "const decisionCutoff=m1=>{const last=m1.at(-1);if(!last)return 0;return Math.floor(last.t/(15*60*1000))*(15*60*1000);};",
              s,count=1
          )
          if n!=1:
              raise SystemExit(f'decisionCutoff replacements={n}')

          new_tick="""async function tick(){if(busy)return;busy=true;try{if(!browserModel||!macroContext)await loadInputs();const series=await fetchSeries(),dataAt=series.m1.at(-1)?.t||0,cutoff=decisionCutoff(series.m1),key=String(cutoff);if(!cutoff)throw new Error('no decision cutoff');if(key!==lastDecisionKey){render(analyze(series,browserModel,macroContext,cutoff));lastDecisionKey=key;}const e=document.getElementById('fxaStatus');if(e){const fmt=t=>new Date(t).toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'});e.textContent='AI判定 '+fmt(cutoff)+' / 価格 '+fmt(dataAt);}}catch(e){console.warn('fx analysis',e);error('分析データ取得待ち');}finally{busy=false;}}"""
          s,n=re.subn(r"async function tick\(\)\{.*?\}\n  function start\(\)\{[^\n]+\}",new_tick+"\n  function start(){tick();setInterval(tick,5000);}",s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'tick/start replacements={n}')

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w,ncache=re.subn(r"const CACHE='asset-goal-v\d+[^']*';","const CACHE='asset-goal-v30-decision-time-fix';",w,count=1)
          if ncache!=1:
              raise SystemExit('cache label not found')
          w=re.sub(r'\?v=\d+', '?v=30', w)
          sw.write_text(w,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fx-analysis.js sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix FX 15-minute decision timestamp"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
