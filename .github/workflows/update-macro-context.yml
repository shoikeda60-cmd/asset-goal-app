name: Update FX Macro Context

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/build_macro_context.py'
      - '.github/workflows/update-macro-context.yml'
  schedule:
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download US 10-year Treasury yield history
        run: curl -fL --retry 3 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2026-01-01' -o DGS10.csv
      - name: Build macro context
        run: python3 tools/build_macro_context.py
      - name: Publish macro context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-context.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FX macro context"
            git push
          fi
